server {
    listen 80;
    server_name _;

    # DNS 解析器
    resolver 8.8.8.8 114.114.114.114 valid=300s ipv6=off;
    resolver_timeout 5s;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # API 反向代理到 CloudRun 后端
    location /api/ {
        proxy_pass https://ai-agent-backend-281019-7-1452995143.sh.run.tcloudbase.com/api/;
        proxy_http_version 1.1;

        # SSE 支持（长连接不缓冲）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;

        # 代理头
        proxy_set_header Host ai-agent-backend-281019-7-1452995143.sh.run.tcloudbase.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # SPA 路由：所有非 API 路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
