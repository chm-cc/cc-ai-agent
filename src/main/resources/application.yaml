    expiration: ${JWT_EXPIRATION:86400000}

# ========== Agent 工具调用失败兜底配置 ==========
# 能力域映射默认通过 CapabilityDomain 枚举定义，以下为可覆盖参数
agent:
  tool-fallback:
    # LLM 调用重试（第 1 层防护）
    llm:
      max-retries: 3
      backoff-ms: [1000, 2000, 4000]
      retryable-exceptions:
        - java.io.IOException
        - java.net.SocketTimeoutException
        - java.util.concurrent.TimeoutException

    # 工具执行重试（第 2 层防护）
    tool:
      max-retries: 2
      backoff-multiplier: 2
      timeout-seconds: 15

    # 降级控制（第 3-4 层防护）
    degradation:
      max-rounds: 2
      same-domain-only: true

    # 熔断控制
    circuit-breaker:
      failure-threshold: 3
      scope: conversation

agents:
  - id: car-advisor
    name: AI 选车大师
    description: 专业选车顾问，根据预算、用途提供个性化购车建议
    icon: "\U0001F697"
    category: advisor
    tags:
      - 智能推荐
      - 多轮对话
      - 知识库
    status: ACTIVE
    sortOrder: 1
  - id: super-agent
    name: AI 超级智能体
    description: 具备工具调用能力，可执行搜索、文件操作等复杂任务
    icon: "\U0001F916"
    category: productivity
    tags:
      - 工具调用
      - 深度思考
      - 多步推理
    status: ACTIVE
    sortOrder: 2
